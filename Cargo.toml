[package]
name = "mdreader"
version = "0.1.0"
edition = "2021"
description = "Lector ligero y nativo de archivos Markdown (README.md)"
license = "MIT"
repository = "https://github.com/Sergi/mdReader"
readme = "README.md"

[dependencies]
# Framework GUI nativo (motor propio, sin WebView / sin Chromium)
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
] }
egui = "0.36"
# Cargadores de imágenes: SOLO locales (file/image/svg/gif/webp).
# Se excluye deliberadamente la feature "http" para que la app NO pueda
# realizar peticiones de red al renderizar Markdown no confiable (evita
# fugas de IP y tracking pixels vía imágenes remotas). Sin "http", el
# EhttpLoader ni siquiera se compila ni se instala.
egui_extras = { version = "0.36", default-features = false, features = [
    "file",
    "image",
    "svg",
    "gif",
    "webp",
] }
# Renderizador de CommonMark/GFM para egui, con resaltado de sintaxis e imágenes
egui_commonmark = { version = "0.25", features = [
    "better_syntax_highlighting",
    "load-images",
] }
# Diálogo de apertura de archivos nativo multiplataforma
rfd = "0.17"
# Watcher del sistema de ficheros para el live reload
notify = "8.2"
# Serialización de las preferencias de UI (tema y zoom) para su persistencia
serde = { version = "1", features = ["derive"] }
# Carga de imágenes referenciadas en el Markdown
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "bmp",
    "webp",
] }

# Dependencias de compilación: embeber el icono en el .exe (solo Windows)
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Perfil de release optimizado para tamaño y rendimiento del binario final
[profile.release]
opt-level = "z"     # optimiza para el menor tamaño
lto = true          # link-time optimization
codegen-units = 1   # mejor optimización a costa de tiempo de compilación
panic = "abort"     # elimina el código de desenrollado de panics
strip = true        # elimina símbolos de depuración del binario
